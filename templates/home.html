{% extends 'base.html' %}{% block pagetitle %}PlantDoc{% endblock %}{% block body %}<section class="chat"><div class="welcome"><h1>Check your plant</h1><p>Upload a leaf photo to scan it.</p></div><div class="message"><div class="avatar">♧</div><div class="bubble"><p>Upload a clear leaf photo.</p></div></div><form action="/submit" method="POST" enctype="multipart/form-data" class="upload-card"><div class="upload-inner"><div class="leaf-illustration">♧</div><div class="upload-copy"><h2>Leaf photo</h2><span id="file-name">No image selected</span></div><div class="upload-actions"><label class="button secondary" for="image">Choose photo</label><button class="button" type="submit">Analyze →</button></div></div><input id="image" name="image" type="file" accept="image/*" required></form></section><script>document.getElementById('image').addEventListener('change',function(){document.getElementById('file-name').textContent=this.files.length?this.files[0].name:'No image selected'});</script>{% endblock %}
