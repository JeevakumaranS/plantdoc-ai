<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block pagetitle %}PlantDoc{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#18362a;--muted:#718278;--line:#e5ebe5;--leaf:#2d7a50;--leaf-dark:#1c5738;--accent:#e7f3e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(125deg,#f7faf5,#edf5ea 50%,#f8f6ed);font:15px/1.5 'DM Sans',sans-serif}.app-shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.sidebar{display:flex;flex-direction:column;padding:30px 20px;background:rgba(255,255,255,.72);border-right:1px solid rgba(46,91,62,.12);backdrop-filter:blur(14px)}.brand{display:flex;gap:11px;align-items:center;padding:0 9px;text-decoration:none;color:var(--ink);font-weight:700;font-size:19px}.brand-mark{display:grid;width:38px;height:38px;place-items:center;background:var(--leaf);color:white;border-radius:13px;box-shadow:0 6px 14px rgba(45,122,80,.2)}.brand-mark svg{width:22px;height:22px}.new-chat{width:100%;margin:37px 0 26px;padding:12px 15px;border:1px solid #d6e5d7;border-radius:12px;background:#fff;color:var(--leaf-dark);font:600 14px inherit;text-align:left;cursor:pointer}.new-chat span{margin-right:9px;font-size:18px}.side-label{margin:0 9px 11px;color:#91a097;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}.history-item{display:flex;align-items:center;gap:10px;padding:11px 10px;color:#5f7267;border-radius:10px;font-size:14px}.history-item.active{color:var(--leaf-dark);background:var(--accent);font-weight:600}.history-item svg{width:17px;height:17px;flex:0 0 auto}.side-note{margin-top:auto;padding:15px;border-radius:14px;color:#59705f;background:#eff6ed;font-size:12px}.side-note strong{display:block;margin-bottom:3px;color:#28563a}main{display:flex;min-width:0;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;padding:24px 42px}.crumb{color:#809087;font-size:14px}.crumb strong{color:var(--ink)}.status{display:flex;align-items:center;gap:8px;color:#607369;font-size:13px}.status i{width:8px;height:8px;border-radius:50%;background:#52aa70;box-shadow:0 0 0 4px #dff1e3}.chat{width:min(880px,calc(100% - 48px));margin:12px auto 48px}.welcome{margin:25px 0 34px;text-align:center}.welcome h1{margin:0 0 9px;font:700 clamp(30px,4vw,47px)/1.1 'Playfair Display',serif;letter-spacing:-.035em}.welcome p{max-width:530px;margin:auto;color:var(--muted);font-size:16px}.message{display:flex;gap:13px;align-items:flex-start;margin:20px 0}.avatar{display:grid;flex:0 0 34px;width:34px;height:34px;place-items:center;border-radius:11px;background:var(--leaf);color:#fff}.avatar svg{width:19px;height:19px}.bubble{max-width:690px;padding:15px 18px;border:1px solid var(--line);border-radius:5px 18px 18px;background:#fff;box-shadow:0 7px 25px rgba(34,74,47,.05)}.bubble p{margin:0}.bubble p+p{margin-top:9px}.user-message{justify-content:flex-end}.user-message .bubble{border:0;border-radius:18px 5px 18px 18px;background:var(--leaf);color:#fff}.upload-card{margin:25px 0 8px 47px;padding:7px;border:1px dashed #9dc5a7;border-radius:20px;background:rgba(255,255,255,.62)}.upload-inner{display:flex;align-items:center;gap:20px;padding:22px;border-radius:14px;background:#fff}.leaf-illustration{display:grid;flex:0 0 70px;width:70px;height:70px;place-items:center;border-radius:18px;background:#e6f3e7;color:var(--leaf)}.leaf-illustration svg{width:39px;height:39px}.upload-copy{flex:1}.upload-copy h2{margin:0 0 4px;font-size:16px}.upload-copy p{margin:0;color:var(--muted);font-size:13px}.upload-actions{display:flex;gap:9px}.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 14px;border:0;border-radius:10px;background:var(--leaf);color:#fff;font:600 13px inherit;cursor:pointer;text-decoration:none}.button:hover{background:var(--leaf-dark)}.button.secondary{border:1px solid #cfe0d1;background:#fff;color:var(--leaf-dark)}#image{display:none}#file-name{display:block;margin-top:8px;color:#577066;font-size:12px}.composer-hint{margin:20px 0 0 47px;color:#8a9a90;font-size:12px;text-align:center}.result-title{margin:4px 0 18px;font:700 29px/1.2 'Playfair Display',serif}.result-grid{display:grid;grid-template-columns:210px 1fr;gap:18px;margin-left:47px}.result-image{width:100%;aspect-ratio:1;object-fit:cover;border-radius:17px;border:4px solid #fff;box-shadow:0 8px 28px rgba(34,74,47,.12)}.result-panel{padding:19px;border:1px solid var(--line);border-radius:17px;background:#fff}.result-panel h3{margin:0 0 7px;font-size:14px;color:var(--leaf-dark)}.result-panel p{margin:0;color:#53665b}.result-panel+.result-panel{margin-top:12px}@media(max-width:720px){.app-shell{display:block}.sidebar{display:none}.topbar{padding:18px 20px}.chat{width:calc(100% - 32px);margin-top:0}.welcome{margin-top:16px}.upload-card,.composer-hint,.result-grid{margin-left:0}.upload-inner{display:block;text-align:center}.leaf-illustration{margin:0 auto 14px}.upload-actions{justify-content:center;margin-top:17px}.result-grid{grid-template-columns:1fr}.result-image{max-width:230px}}
</style></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">♧</span>PlantDoc</a><button class="new-chat" type="button" onclick="location.href='/'"><span>＋</span>New scan</button><p class="side-label">Workspace</p><div class="history-item active">▢ &nbsp;Plant scan</div></aside><main><header class="topbar"><div class="crumb"><strong>PlantDoc</strong></div><div class="status"><i></i>Online</div></header>{% block body %}{% endblock %}</main></div></body></html>
